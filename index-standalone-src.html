  <script>
    // Tweaks defaults — host rewrites this block on disk when user changes a value.
    window.TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
      "theme": "sage",
      "nameLayout": "stacked"
    }/*EDITMODE-END*/;
    // Apply pre-paint to avoid flash
    (function(){
      var d = window.TWEAK_DEFAULTS || {};
      if (d.theme && d.theme !== 'warm') document.documentElement.setAttribute('data-theme', d.theme);
      document.documentElement.setAttribute('data-name-layout', d.nameLayout || 'stacked');
    })();
  </script>
