<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>S Mani Kumar — Full-Stack Engineer</title>
  <meta name="description" content="Portfolio of S Mani Kumar — full-stack developer building accessibility-first web and mobile applications with React, Node, Laravel and Flutter." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="styles.css" />

  <script>
    window.TWEAK_DEFAULTS = { "theme": "sage", "nameLayout": "stacked" };
    (function(){
      var d = window.TWEAK_DEFAULTS;
      if (d.theme && d.theme !== 'warm') document.documentElement.setAttribute('data-theme', d.theme);
      document.documentElement.setAttribute('data-name-layout', d.nameLayout || 'stacked');
      document.documentElement.classList.add('is-print');
    })();
  </script>

  <style>
    /* ============ Print-friendly overrides (screen preview) ============ */
    html.is-print, html.is-print body {
      overflow: visible !important;
    }
    /* Force every reveal/entry element to visible — no JS animation reliance */
    html.is-print .reveal,
    html.is-print .reveal-stagger,
    html.is-print .reveal-stagger > *,
    html.is-print .hero-enter > * {
      opacity: 1 !important;
      transform: none !important;
      transition: none !important;
      animation: none !important;
    }
    /* Hide tweaks panel + nav for print preview */
    html.is-print .twk-panel,
    html.is-print .nav {
      display: none !important;
    }
    /* Tighten hero — collapse the 100vh min-height for print flow */
    html.is-print .hero {
      min-height: 0 !important;
      padding: 60px 0 80px !important;
    }
    html.is-print section { padding: 70px 0 !important; }
    /* Disable expensive shadow/blur effects that don't render well in PDF */
    html.is-print *::before,
    html.is-print *::after { animation: none !important; }
    /* Disable body grain noise (heavy in PDF) */
    html.is-print body::before { display: none !important; }
    /* Disable floating aurora animations */
    html.is-print .hero-aurora::before,
    html.is-print .hero-aurora::after { animation: none !important; }
    /* Disable dot pulse */
    html.is-print .nav-brand-dot { animation: none !important; }

    /* ============ Print media ============ */
    @media print {
      @page {
        size: A4 portrait;
        margin: 14mm 12mm;
      }

      :root, html, body {
        background: #0a0a0d !important;
        color: #f3ede2 !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }
      html, body { overflow: visible !important; height: auto !important; }
      body::before, body::after { display: none !important; }
      .shell { display: block !important; }

      /* Hide chrome */
      .nav, .twk-panel, .footer-built { display: none !important; }

      /* Sections — clean, non-clipped, page-friendly */
      section {
        padding: 24px 0 !important;
        break-inside: avoid;
        page-break-inside: avoid;
      }
      .container { max-width: none !important; padding: 0 !important; }

      /* Hero — fit on first page */
      .hero {
        min-height: 0 !important;
        padding: 0 0 18px !important;
        break-after: page;
        page-break-after: always;
      }
      .hero-aurora { display: none !important; }
      .hero-title { font-size: 64px !important; line-height: 1 !important; }
      .hero-lede { font-size: 14px !important; max-width: 100% !important; }
      .hero-meta { margin-top: 36px !important; }
      .hero-meta-cell { padding: 14px 16px !important; }
      .hero-meta-value { font-size: 13px !important; }
      .hero-actions { display: none !important; }
      .hero-rotator { display: none !important; }

      /* Section headings sized for print */
      .section-head { margin-bottom: 24px !important; }
      .section-head h2 { font-size: 32px !important; }
      .section-head-right { font-size: 12px !important; }
      .eyebrow { font-size: 9px !important; }

      /* About */
      .about-grid { gap: 24px !important; grid-template-columns: 1.4fr 1fr !important; }
      .about-prose p { font-size: 12.5px !important; margin-bottom: 10px !important; }
      .stat-card { padding: 14px 16px !important; }
      .stat-value { font-size: 28px !important; }
      .stat-label { font-size: 9px !important; }

      /* Skills */
      .skills-grid { grid-template-columns: repeat(3, 1fr) !important; gap: 10px !important; }
      .skill-card { padding: 14px !important; break-inside: avoid; }
      .skill-title { font-size: 17px !important; }
      .skill-desc { font-size: 11px !important; margin-bottom: 10px !important; }
      .chip { font-size: 9px !important; padding: 3px 7px !important; }

      /* Projects */
      .project-card {
        grid-template-columns: 60px 1.1fr 1.6fr auto !important;
        padding: 14px 18px !important;
        gap: 18px !important;
        break-inside: avoid;
      }
      .project-name { font-size: 17px !important; }
      .project-desc { font-size: 11px !important; }
      .project-domain { font-size: 10px !important; }
      .project-arrow { width: 32px !important; height: 32px !important; }
      .project-tech .chip { font-size: 8.5px !important; }

      /* Timeline */
      .tl-item { padding-bottom: 22px !important; break-inside: avoid; }
      .tl-role { font-size: 20px !important; }
      .tl-company { font-size: 12px !important; margin-bottom: 10px !important; }
      .tl-bullet { font-size: 11.5px !important; }
      .tl-period { font-size: 9px !important; }

      /* Contact card */
      .contact-card { padding: 36px 28px !important; break-inside: avoid; }
      .contact-title { font-size: 40px !important; }
      .contact-sub { font-size: 13px !important; }
      .contact-email-btn { font-size: 12px !important; padding: 10px 12px 10px 16px !important; }
      .contact-prelude { font-size: 10px !important; margin-bottom: 16px !important; }

      /* Force every fade element to fully visible */
      .reveal, .reveal-stagger, .reveal-stagger > *, .hero-enter > * {
        opacity: 1 !important;
        transform: none !important;
        animation: none !important;
        transition: none !important;
      }

      /* Suppress hover-only or animated decorations */
      .hero-tag, .nav, .contact-actions { break-inside: avoid; }

      /* Avoid orphaned section headings */
      .section-head, h1, h2, h3 { break-after: avoid; page-break-after: avoid; }

      /* Footer minimal */
      .footer { padding: 18px 0 0 !important; margin-top: 24px !important; }
      .footer-copy, .footer-built { font-size: 9.5px !important; }

      a { color: inherit !important; text-decoration: none !important; }
    }
  </style>
</head>
<body>
  <div class="shell" id="app"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" data-presets="react" src="portfolio-a.jsx"></script>
  <script type="text/babel" data-presets="react" src="portfolio-b.jsx"></script>

  <script type="text/babel" data-presets="react">
    const App = () => (
      <React.Fragment>
        <Hero />
        <About />
        <Skills />
        <Projects />
        <Experience />
        <Contact />
      </React.Fragment>
    );
    ReactDOM.createRoot(document.getElementById('app')).render(<App />);
  </script>

  <script type="text/babel" data-presets="react">
    // Auto-print once React + fonts are ready (no Tweaks panel in print build)
    (async () => {
      try { if (document.fonts && document.fonts.ready) await document.fonts.ready; } catch (e) {}
      // Wait for React mount + reveal-on-scroll observer to settle
      await new Promise((r) => setTimeout(r, 900));
      window.print();
    })();
  </script>
</body>
</html>
